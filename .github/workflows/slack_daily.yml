name: Relatorio diario no Slack

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  slack-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: pip install requests google-ads==31.1.0

      - name: Roda relatorio diario
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_ACT_ID: ${{ secrets.META_ACT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          PLOOMES_USER_KEY: ${{ secrets.PLOOMES_USER_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python slack_daily.py
